[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # STAGING: keeps the review URL out of search results.
    # Remove this line (and robots.txt) before going live on med5.health.
    X-Robots-Tag = "noindex, nofollow"
